# Local stand-in for the AWS Application Load Balancer: one front door, routed by path
# exactly like the listener rules in terraform/main.tf.

server {
    listen 80;

    # Docker's DNS, so containers that restart get picked up again
    resolver 127.0.0.11 valid=10s;
    set $products http://product-api:8080;
    set $carts    http://shopping-cart-dynamo:8080;
    set $orders   http://order-receiver:8080;

    location = /products        { proxy_pass $products; }
    location /products/         { proxy_pass $products; }
    location /inventory/mode/   { proxy_pass $products; }
    location = /metrics         { proxy_pass $products; }

    location = /shopping-carts  { proxy_pass $carts; }
    location /shopping-carts/   { proxy_pass $carts; }

    location /orders/           { proxy_pass $orders; }

    location / {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"No service handles this path"}';
    }
}
