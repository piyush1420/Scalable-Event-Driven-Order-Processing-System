spring.application.name=order-processor
# Only /health is served over HTTP; the real work happens in the worker threads
server.port=${PORT:8080}
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

sqs.queue-url=${SQS_QUEUE_URL:}
# How many workers poll the queue in parallel (the HW7 experiment tried 1, 5, 20 and 100)
processor.num-workers=${NUM_WORKERS:1}
aws.region=${AWS_REGION:us-east-1}
aws.endpoint-url=${AWS_ENDPOINT_URL:}
