# The whole store on your laptop. AWS services are emulated by moto; MySQL runs in a container.
#
#   docker compose up --build        # first build takes a few minutes (Maven runs inside Docker)
#   curl localhost:8000/products/1   # the front door, routed like the AWS load balancer
#
# Ports: 8000 front door | 8080 product-api | 8081 inventory-service | 8082 MySQL cart
#        8083 DynamoDB cart | 8084 order-receiver | 8085 order-processor (health only)

name: online-store

x-aws-env: &aws-env
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://aws:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-java-health: &java-health
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
  interval: 5s
  timeout: 3s
  retries: 30

services:
  # ── infrastructure ──
  aws:
    image: motoserver/moto:5.2.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 3s
      timeout: 3s
      retries: 20

  aws-init:
    image: motoserver/moto:5.2.5
    entrypoint: ["python", "/init/init_local_aws.py"]
    environment: *aws-env
    volumes:
      - ./local/init_local_aws.py:/init/init_local_aws.py:ro
    depends_on:
      aws:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: admin
      MYSQL_PASSWORD: local-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── products (HW5) ──
  inventory-service:
    build: ./services/inventory-service
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/stats"]
      interval: 5s
      timeout: 3s
      retries: 30

  product-api:
    build: ./services/product-api
    environment:
      INVENTORY_URL: http://inventory-service:8081
    ports: ["8080:8080"]
    healthcheck: *java-health
    depends_on:
      inventory-service:
        condition: service_healthy

  # ── shopping carts (HW8) ──
  shopping-cart:
    build: ./services/shopping-cart
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ecommerce
      DB_USER: admin
      DB_PASSWORD: local-password
    ports: ["8082:8080"]
    healthcheck: *java-health
    depends_on:
      mysql:
        condition: service_healthy

  shopping-cart-dynamo:
    build: ./services/shopping-cart-dynamo
    environment:
      <<: *aws-env
      DYNAMODB_TABLE: online-store-shopping-carts
    ports: ["8083:8080"]
    healthcheck: *java-health
    depends_on:
      aws-init:
        condition: service_completed_successfully

  # ── orders (HW7) ──
  order-receiver:
    build: ./services/order-receiver
    environment:
      <<: *aws-env
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:online-store-order-processing-events
    ports: ["8084:8080"]
    healthcheck: *java-health
    depends_on:
      aws-init:
        condition: service_completed_successfully

  order-processor:
    build: ./services/order-processor
    environment:
      <<: *aws-env
      SQS_QUEUE_URL: http://aws:5000/123456789012/online-store-order-processing-queue
      NUM_WORKERS: "2"
    ports: ["8085:8080"]
    healthcheck: *java-health
    depends_on:
      aws-init:
        condition: service_completed_successfully

  # ── the front door (stands in for the AWS load balancer) ──
  front-door:
    image: nginx:1.30-alpine
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8000:80"]
    depends_on:
      product-api:
        condition: service_healthy
      shopping-cart-dynamo:
        condition: service_healthy
      order-receiver:
        condition: service_healthy
